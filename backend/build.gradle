plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.onfilm.local'
version = '0.1.0'

// Verification must not overwrite the JAR used by a running desktop app.
if (providers.gradleProperty('verificationBuild').isPresent()) {
    layout.buildDirectory = layout.projectDirectory.dir('build-verification')
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = 'onfilm-local.jar' }
