<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnFilm 포트폴리오</title><script src="contact-email.js" defer></script>
<link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/actor-detail.css"><link rel="stylesheet" href="css/local-detail.css"><link rel="stylesheet" href="public.css">
<script src="vendor/hls.js/hls.min.js" defer></script><script src="film-preview.js" defer></script><script src="public-film-card.js" defer></script><script src="public-profile.js" defer></script></head><body>
<div class="page-root"><header><div class="container header-row"><a href="index.html" class="logo">OnFilm</a></div></header>
<main class="container"><p id="publicStatus" role="status">포트폴리오를 불러오는 중입니다.</p>
<div class="profile-header"><img id="profilePhoto" class="profile-photo" src="images/profile-placeholder.png" alt="프로필 사진">
<div class="profile-info"><div class="profile-core"><div class="profile-title-row"><h1 id="profileName"></h1></div><div class="meta" id="profileMeta"></div></div><p class="bio" id="bioDisplay"></p><section class="profile-tag-section"><div class="profile-tag-title">SNS</div><div class="sns-row" id="snsRow"></div></section>
<section id="contactSection" class="profile-tag-section" hidden><div class="profile-tag-title">CONTACT ME</div><div class="contact-email-row"><span id="contactEmailDisplay"></span><button id="copyContactEmail" class="contact-copy-button" type="button" title="이메일 복사" aria-label="이메일 복사" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg></button></div><span id="contactCopyStatus" class="contact-copy-status" role="status" aria-live="polite"></span></section>
<section class="profile-tag-section"><div class="profile-tag-title">PROFILE TAGS</div><div class="profile-tag-list" id="tagList"></div></section></div></div>
<section class="filmography-section"><div class="film-section-heading"><h2>FILMOGRAPHY</h2><a href="filmography.html" id="moreFilmography">더보기 ›</a></div><p id="filmEmpty" hidden>게시물 없음</p><div class="film-slider-container"><button id="filmPrevBtn" class="film-arrow left" aria-label="이전 작품">‹</button><div class="film-slider-wrapper"><div class="film-slider" id="filmSlider"></div></div><button id="filmNextBtn" class="film-arrow right" aria-label="다음 작품">›</button></div></section>
<section class="gallery-section"><h2>PHOTO</h2><p id="photoEmpty" hidden>게시물 없음</p><div class="gallery-grid" id="galleryGrid"></div></section>
</main><footer>OnFilm · Actor Portfolio</footer></div>
<dialog id="details" tabindex="-1" aria-labelledby="detailsTitle"><h2 id="detailsTitle"></h2><p id="detailsText"></p></dialog>
<div id="lightbox" class="gallery-lightbox-overlay" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
<button type="button" id="previousPhoto" class="gallery-lightbox-arrow left" aria-label="이전 사진">‹</button>
<img id="lightboxImage" class="gallery-lightbox-image" alt="사진 크게 보기">
<button type="button" id="nextPhoto" class="gallery-lightbox-arrow right" aria-label="다음 사진">›</button>
<button type="button" id="closeLightbox" class="local-lightbox-close btn">닫기</button></div>
</body></html>
