<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>필모그래피 · OnFilm</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/actor-detail.css">
  <link rel="stylesheet" href="/css/local-detail.css"><link rel="stylesheet" href="/css/filmography-view.css">
  <link rel="stylesheet" href="/css/notifications.css"><script src="/notifications.js" defer></script>
</head>
<body>
  <header><div class="container header-row"><a class="logo" href="/profile.html">OnFilm</a><div class="header-right" id="headerActions"></div></div></header>
  <main class="container filmography-view">
    <a href="/profile.html" id="backToProfile" class="back-link">← 프로필</a>
    <div class="film-section-heading"><h1>FILMOGRAPHY</h1><a href="/edit-filmography.html">편집</a></div>
    <p id="filmsStatus" role="status">필모그래피를 불러오는 중입니다.</p>
    <button type="button" class="btn" id="retryFilms" hidden>다시 읽기</button>
    <div id="filmGroups" hidden>
      <section hidden aria-labelledby="videoHeading"><h2 id="videoHeading">단편 <span id="videoCount"></span></h2><div class="film-grid" id="videoFilms"></div><p class="group-empty" id="videoEmpty">등록된 단편 작품이 없습니다.</p></section>
      <section hidden aria-labelledby="directingHeading"><h2 id="directingHeading">연출 <span id="directingCount"></span></h2><div class="film-grid" id="directingFilms"></div><p class="group-empty" id="directingEmpty">등록된 연출 작품이 없습니다.</p></section>
      <section hidden aria-labelledby="leadHeading"><h2 id="leadHeading">주연 <span id="leadCount"></span></h2><div class="film-grid" id="leadFilms"></div><p class="group-empty" id="leadEmpty"></p></section>
      <section hidden aria-labelledby="supportingHeading"><h2 id="supportingHeading">조연 <span id="supportingCount"></span></h2><div class="film-grid" id="supportingFilms"></div><p class="group-empty" id="supportingEmpty"></p></section>
      <section hidden aria-labelledby="experienceHeading"><h2 id="experienceHeading">단역 <span id="experienceCount"></span></h2><div class="film-grid" id="experienceFilms"></div><p class="group-empty" id="experienceEmpty">등록된 단역이 없습니다.</p></section>
    </div>
  </main>
  <dialog id="filmDetails" aria-labelledby="detailsTitle"><h2 id="detailsTitle"></h2><p id="detailsText"></p><button type="button" class="btn" id="closeDetails">닫기</button></dialog>
  <script src="/vendor/hls.js/hls.min.js"></script><script src="/film-preview.js"></script><script src="/filmography-view.js"></script>
</body>
</html>
